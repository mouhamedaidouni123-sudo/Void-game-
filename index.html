<script>
/* ===== الصق إعدادات Firebase هنا (استبدل القيم التي بين علامات التنصيص) ===== */
const FIREBASE_CONFIG = {
  apiKey: "AIzaSyDQzxC9u1z86-zTqRiPYEvoN-VKYrP5WLc",
  authDomain: "void-game-ice.firebaseapp.com",
  databaseURL: "https://void-game-ice-default-rtdb.europe-west1.firebasedatabase.app",
  projectId: "void-game-ice",
  storageBucket: "void-game-ice.firebasestorage.app",
  messagingSenderId: "63151077436",
  appId: "1:63151077436:web:7d8b3472703dae89c4ab39"
};
/* ================================================================== */
let _db=null;
function fbDb(){if(!_db){firebase.initializeApp(FIREBASE_CONFIG);_db=firebase.database()}return _db}
async function fbJoin(c){
  fbDb();
  const ref=_db.ref('rooms/'+c+'/ev');
  const off=(await _db.ref('.info/serverTimeOffset').once('value')).val()||0;
  const me=Math.random().toString(36).slice(2,10),t0=Date.now()+off-1500,H={};
  ref.on('child_added',snap=>{
    const v=snap.val();
    if(!v||v.ts<t0)return;
    (H[v.t]||[]).forEach(f=>f({peer:v.p,data:v.d,isMe:v.p===me,sameTab:v.p===me}));
  });
  return{
    on:(t,f)=>{(H[t]=H[t]||[]).push(f)},
    emit:(t,d)=>{ref.push({t,d,p:me,ts:firebase.database.ServerValue.TIMESTAMP})}
  };
}
</script>

  $('#sn').onclick=()=>{const v=$('#nm').value.trim();if(v){P.n=v;save();shop(tab)}};

}

  try{room=await fbJoin(c)}catch(e){console.error(e)}
  if(!room){$('#er').textContent='تعذّر الاتصال بقاعدة البيانات. تأكد من إعدادات Firebase.';return}
  Object.assign(S,{name:n,host,room,code:c,players:{},hits:[],i:-1,auto:!!auto});
  room.on('join',m=>{
    if(!S.players[m.peer])S.players[m.peer]=Object.assign({n:String(m.data&&m.data.n||'لاعب').slice(0,16),s:0},vp(m.data));
    if(m.isMe&&m.sameTab)S.me=m.peer;
    if(S.host)room.emit('roster',Object.entries(S.players).map(([p,v])=>({p,n:v.n,s:v.s,a:v.a,f:v.f,c:v.c})));
    if(S.phase==='lobby')lobby();
  });
  room.on('roster',m=>{
    (m.data||[]).forEach(x=>{if(!S.players[x.p])S.players[x.p]=Object.assign({n:String(x.n).slice(0,16),s:x.s|0},vp(x))});
    if(S.phase==='lobby')lobby();
  });
  room.on('q',m=>{const d=m.data||{};if(!(d.i>=0&&d.i<QS.length))return;S.i=d.i|0;S.r=d.r|0;S.nq=d.t|0;if(S.r===1){Object.values(S.players).forEach(p=>p.s=0);S.paid=false;S.earn=0}S.hits=[];S.dl=Date.now()+T;showQ()});
  room.on('guess',m=>{
    if(!S.host||S.phase!=='q'||!m.data||m.data.i!==S.i||S.hits.length>=N)return;
    const k=MAPS[S.i][norm(String(m.data.t).slice(0,40))];
    if(k===undefined)return room.emit('miss',{p:m.peer,r:'x'});
    if(S.hits.some(h=>h.k===k))return room.emit('miss',{p:m.peer,r:'d'});
    const pl=S.players[m.peer]||(S.players[m.peer]={n:'لاعب',s:0});
    const h={k,p:m.peer,n:pl.n,pts:N-k};
    applyHit(h);
    room.emit('hit',{i:S.i,...h});
    if(S.hits.length>=N)room.emit('end',{i:S.i});
  });
  room.on('hit',m=>{
    if(S.host||S.phase!=='q'||m.data.i!==S.i)return;
    const d=m.data;
    if(!S.players[d.p])S.players[d.p]={n:String(d.n).slice(0,16),s:0};
    applyHit({k:d.k|0,p:d.p,n:String(d.n).slice(0,16),pts:d.pts|0});
  });
  room.on('miss',m=>{if(m.data&&m.data.p===S.me)toast(m.data.r==='d'?'سبقك أحدهم لهذه الإجابة 😅':'ليست من الإجابات ❌')});
  room.on('end',m=>{if(S.phase==='q'&&m.data.i===S.i)finish()});
  room.emit('join',{n,a:P.a,f:P.f,c:P.c});
  lobby();
  if(S.auto&&S.host)startMM();
}
function applyHit(h){
  S.hits.push(h);
  S.players[h.p].s+=h.pts;
  if(S.phase==='q')draw();
}
function plan(){
  let seen=[];try{seen=JSON.parse(localStorage.getItem('vs')||'[]')}catch(e){}
  const ids=QS.map((q,i)=>i).filter(i=>S.sel.has(QS[i][2]));
  let pool=ids.filter(i=>!seen.includes(i));
  if(pool.length<S.tot){seen=seen.filter(i=>!ids.includes(i));pool=ids.slice()}
  for(let j=pool.length-1;j>0;j--){const k=Math.floor(Math.random()*(j+1));[pool[j],pool[k]]=[pool[k],pool[j]]}
  const p=pool.slice(0,Math.min(S.tot,pool.length));
  try{localStorage.setItem('vs',JSON.stringify(seen.concat(p)))}catch(e){}
  return p;
}
function presence(){
  try{
    const db=fbDb(),me=db.ref('presence/'+Math.random().toString(36).slice(2,10));
    db.ref('.info/connected').on('value',x=>{if(x.val()){me.onDisconnect().remove();me.set(Date.now())}});
    db.ref('presence').on('value',x=>{const e=$('#onl');if(e)e.textContent='🟢 المتصلون الآن: '+x.numChildren()});
  }catch(e){}
}
async function quick(){
  const n=P.n;
  $('#er').textContent='جارٍ البحث عن لعبة...';
  try{
    const r=fbDb().ref('mm/open');
    const res=await r.transaction(cur=>{
      const now=Date.now();
      if(cur&&cur.n<4&&now-cur.t<45000)return{c:cur.c,n:cur.n+1,t:cur.t};
      return{c:code(),n:1,t:now};
    });
    const v=res.snapshot.val();
    if(!v||!v.c)throw 0;
    enter(v.c,v.n===1,true);
  }catch(e){$('#er').textContent='تعذّر الاتصال، حاول مرة أخرى'}
}
function startMM(){
  S.t0=Date.now();let last=0;
  S.mm=setInterval(()=>{
    const n=Object.keys(S.players).length,el=(Date.now()-S.t0)/1000;
    const w=$('#wt');if(w)w.textContent=n<2?'بانتظار لاعبين آخرين...':(n>=4?'اكتمل العدد!':'ستبدأ اللعبة بعد '+Math.max(0,Math.ceil(25-el))+' ثانية');
    if(el-last>=10){last=el;fbDb().ref('mm/open').transaction(c=>c&&c.c===S.code?{c:c.c,n:c.n,t:Date.now()}:c)}
    if(n>=4||(el>=25&&n>=2)){
      clearInterval(S.mm);
      fbDb().ref('mm/open').transaction(c=>c&&c.c===S.code?null:c);
      S.sel=new Set(CATS);S.tot=6;S.plan=plan();
      S.room.emit('q',{i:S.plan[0],r:1,t:S.plan.length});
    }
  },1000);
}
function lobby(){
  S.phase='lobby';document.body.classList.remove('play');
  const list=Object.values(S.players).map(p=>`<div class="row"><span>${pn(p)}</span></div>`).join('')||'<p class="s">بانتظار اللاعبين...</p>';
  if(S.auto){app.innerHTML=`<div class="card" style="text-align:center"><div style="font-size:38px">🎲</div><b>نبحث عن منافسين عشوائيين...</b><p class="s" id="wt" style="margin:8px 0 0">${S.host?'بانتظار لاعبين آخرين...':'بانتظار بدء اللعبة'}</p></div><div class="card"><b>اللاعبون (${Object.keys(S.players).length})</b>${list}</div>`;return}
  const cfg=S.host?`<div class="card"><b>المواضيع</b><div class="chips2" id="cats" style="margin-top:8px">${CATS.map(c=>`<span class="chip ${S.sel.has(c)?'on':''}" data-c="${c}">${c}</span>`).join('')}</div>
  <p class="s" style="margin:14px 0 6px;text-align:right">عدد الأسئلة</p><div class="chips2" id="nn">${[5,8,12].map(n=>`<span class="chip ${S.tot===n?'on':''}" data-n="${n}">${n}</span>`).join('')}</div>
  <p class="s" style="margin:10px 0 0;font-size:13px">${QS.filter(q=>S.sel.has(q[2])).length} سؤالاً متاحاً في المواضيع المختارة</p></div>`:'';
  app.innerHTML=`<div class="card"><p class="s" style="margin:0">كود الغرفة (شاركه مع أصدقائك)</p>
  <div class="code">${S.code}</div></div>
  <div class="card"><b>اللاعبون</b>${list}</div>${cfg}
  ${S.host?'<button id="go">ابدأ اللعبة</button>':'<p class="s">بانتظار المضيف ليبدأ...</p>'}`;
  if(S.host){
    app.querySelectorAll('#cats .chip').forEach(e=>e.onclick=()=>{const c=e.dataset.c;if(S.sel.has(c)){if(S.sel.size>1)S.sel.delete(c)}else S.sel.add(c);lobby()});
    app.querySelectorAll('#nn .chip').forEach(e=>e.onclick=()=>{S.tot=+e.dataset.n;lobby()});
    $('#go').onclick=()=>{S.plan=plan();S.room.emit('q',{i:S.plan[0],r:1,t:S.plan.length})};
  }
}
function board(){
  return Object.values(S.players).sort((a,b)=>b.s-a.s).map(p=>`<div class="row"><span>${esc(p.n)}</span><b>${p.s}</b></div>`).join('');
}
function slots(show){
  const q=QS[S.i];
  let h='';
  for(let j=0;j<N;j++){
    const x=S.hits.find(t=>t.k===j),pt=N-j;
    h+=x?`<div class="slot f"><span><b>${j+1}.</b> ${esc(nm(q,j))} <small>— ${S.players[x.p]?pn(S.players[x.p]):esc(x.n)}</small></span><span class="pt">+${pt}</span></div>`
        :`<div class="slot"><span><b>${j+1}.</b> ${show?esc(nm(q,j)):'؟؟؟'}</span><span class="pt">${pt}</span></div>`;
  }
  return h;
}
function showQ(){
  S.phase='q';document.body.classList.add('play');
  const q=QS[S.i];
  app.innerHTML=`<div class="card" style="margin-bottom:8px;padding:12px"><div class="top"><span>سؤال ${S.r} من ${S.nq} · ${QS[S.i][2]}</span><span id="tl">60</span></div>
  <div class="bar"><i id="pb"></i></div><div class="q" style="font-size:19px;margin:4px 0 10px">${esc(q[0])}</div>
  <div id="sl" class="sg"></div><div class="chips" id="bd"></div>
  <p class="s" id="msg" style="margin:6px 0 0;min-height:20px;font-size:13px"></p></div>
  <div class="dock"><input id="gs" placeholder="اكتب إجابتك هنا" maxlength="40" autocomplete="off"><button id="sd">إرسال</button></div>`;
  const send=()=>{const t=$('#gs').value.trim();if(!t||S.phase!=='q')return;$('#gs').value='';S.room.emit('guess',{i:S.i,t});$('#gs').focus()};
  $('#sd').onclick=send;
  $('#gs').onkeydown=e=>{if(e.key==='Enter')send()};
  draw();
  clearInterval(S.tm);
  S.tm=setInterval(()=>{
    const left=Math.max(0,S.dl-Date.now());
    const t=$('#tl'),p=$('#pb');
    if(t)t.textContent=Math.ceil(left/1000);
    if(p)p.style.width=(left/T*100)+'%';
    if(left<=0){clearInterval(S.tm);if(S.host&&S.phase==='q')S.room.emit('end',{i:S.i})}
  },250);
}
function draw(){const a=$('#sl'),b=$('#bd');if(a)a.innerHTML=slots();if(b)b.innerHTML=Object.values(S.players).sort((x,y)=>y.s-x.s).map(p=>`<span class="chip">${pn(p)} · <b style="color:var(--pri)">${p.s}</b></span>`).join('')}
function finish(){
  clearInterval(S.tm);
  S.phase='r';document.body.classList.remove('play');
  const q=QS[S.i];
  const last=S.r>=S.nq;
  const found=new Set(S.hits.map(h=>h.k));
  const miss=q[1].map((_,k)=>k).filter(k=>!found.has(k)).slice(0,8).map(k=>esc(nm(q,k))).join('، ');
  const rank=Object.values(S.players).sort((a,b)=>b.s-a.s);
  if(last&&!S.paid&&S.players[S.me]){S.paid=true;const me=S.players[S.me];S.earn=me.s+10+(rank[0]===me&&rank.length>1?25:0);P.coins+=S.earn;save()}
  const rows=rank.map((p,k)=>`<div class="row"><span>${last&&k===0?'🏆 ':(k+1)+'. '}${pn(p)}</span><b>${p.s}</b></div>`).join('');
  app.innerHTML=`<div class="card"><div class="q">${esc(q[0])}</div><div class="sg">${slots(true)}</div></div>
  <div class="card"><b>${last?'النتيجة النهائية':'الترتيب'}</b>${last&&S.earn?` <span class="pt" style="float:left">+${S.earn} 🪙</span>`:''}${rows}</div>
  ${S.host?`<button id="nx">${last?'لعبة جديدة':'السؤال التالي'}</button>`:`<p class="s">${last?'انتهت اللعبة 🎉':'بانتظار المضيف...'}</p>`}`;
  const nx=$('#nx');
  if(S.auto&&last){if(nx)nx.remove();const b=document.createElement('button');b.textContent='العودة للرئيسية';b.onclick=()=>location.reload();app.appendChild(b)}
  else if(S.host&&nx)nx.onclick=()=>{if(last)lobby();else S.room.emit('q',{i:S.plan[S.r],r:S.r+1,t:S.nq})};
}
home();
presence();
</script>

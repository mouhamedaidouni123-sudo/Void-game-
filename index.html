/* ===== نظام البطولات التلقائية والمشاهدة المباشرة والتعليقات مع الإشراف ===== */
const VOID_LIVE = (() => {
  const state = {
    code: null,
    net: null,
    me: { id: 'u_' + Math.random().toString(36).slice(2, 9), name: 'لاعب VOID', avatar: 0, frame: 0, nameColor: 0, isHost: false, isMod: false },
    role: 'player',
    players: [],
    spectators: [],
    bracket: null,
    liveMatch: { matchId: null, p1: null, p2: null, s1: 0, s2: 0, question: 'في انتظار بدء البطولة...', qIndex: -1, hits: [], endsAt: 0, status: 'waiting' },
    comments: [],
    bannedIds: [],
    chatLocked: false,
    onUpdate: null,
    timerId: null
  };

  function pickQuestion() {
    const qIndex = Math.floor(Math.random() * QS.length);
    return { qIndex, question: QS[qIndex][0] };
  }

  function syncPresence() {
    if (!state.net) return;
    state.net.emit('tourn_presence', { user: { ...state.me }, role: state.role });
  }

  function shuffle(arr) {
    const a = arr.slice();
    for (let i = a.length - 1; i > 0; i--) {
      const j = Math.floor(Math.random() * (i + 1));
      [a[i], a[j]] = [a[j], a[i]];
    }
    return a;
  }

  function propagateWinners(rounds) {
    for (let r = 0; r < rounds.length - 1; r++) {
      rounds[r].forEach(m => {
        if (!m.winner) return;
        const nextM = rounds[r + 1][Math.floor(m.matchIndex / 2)];
        if (!nextM) return;
        if (m.matchIndex % 2 === 0) nextM.p1 = m.winner;
        else nextM.p2 = m.winner;
        if (nextM.p1 && nextM.p2 && nextM.status === 'waiting') nextM.status = 'pending';
      });
    }
  }

  function findNextMatch(rounds) {
    for (let r = 0; r < rounds.length; r++) {
      for (const m of rounds[r]) {
        if (m.p1 && m.p2 && !m.winner) return m;
      }
    }
    return null;
  }

  function generateBracket(rawPlayers) {
    const shuffled = shuffle((rawPlayers || []).filter(p => p && p.id));
    const size = shuffled.length <= 2 ? 2 : shuffled.length <= 4 ? 4 : 8;
    const slots = Array.from({ length: size }, (_, i) => shuffled[i] || null);
    const rounds = [];
    const r0 = [];
    for (let i = 0; i < size; i += 2) {
      const p1 = slots[i], p2 = slots[i + 1];
      let winner = null, status = 'pending';
      if (p1 && !p2) { winner = p1; status = 'bye'; }
      else if (!p1 && p2) { winner = p2; status = 'bye'; }
      else if (!p1 && !p2) { status = 'empty'; }
      r0.push({ id: `r0_m${i / 2}`, roundIndex: 0, matchIndex: i / 2, p1, p2, s1: 0, s2: 0, winner, status });
    }
    rounds.push(r0);

    let prev = r0.length, rIdx = 1;
    while (prev > 1) {
      const cnt = Math.ceil(prev / 2);
      rounds.push(Array.from({ length: cnt }, (_, m) => ({
        id: `r${rIdx}_m${m}`, roundIndex: rIdx, matchIndex: m, p1: null, p2: null, s1: 0, s2: 0, winner: null, status: 'waiting'
      })));
      prev = cnt;
      rIdx++;
    }
    propagateWinners(rounds);
    const finalM = rounds[rounds.length - 1][0];
    const nextM = findNextMatch(rounds);
    return { rounds, champion: finalM && finalM.winner ? finalM.winner : null, currentMatchId: nextM ? nextM.id : null };
  }

  function createMatchLiveState(match) {
    if (!match) {
      return { matchId: null, p1: null, p2: null, s1: 0, s2: 0, question: 'انتهت البطولة', qIndex: -1, hits: [], endsAt: 0, status: 'finished' };
    }
    const q = pickQuestion();
    return {
      matchId: match.id,
      p1: match.p1,
      p2: match.p2,
      s1: 0,
      s2: 0,
      question: q.question,
      qIndex: q.qIndex,
      hits: [],
      endsAt: Date.now() + 45000,
      status: 'playing'
    };
  }

  function recordMatchResult(matchId, s1, s2, explicitWinnerId = null) {
    if (!state.bracket) return;
    for (const round of state.bracket.rounds) {
      const m = round.find(item => item.id === matchId);
      if (!m) continue;
      m.s1 = Math.max(0, +s1 || 0);
      m.s2 = Math.max(0, +s2 || 0);
      if (explicitWinnerId === m.p1?.id) m.winner = m.p1;
      else if (explicitWinnerId === m.p2?.id) m.winner = m.p2;
      else m.winner = m.s2 > m.s1 ? m.p2 : m.p1;
      m.status = 'finished';

      propagateWinners(state.bracket.rounds);
      const finalM = state.bracket.rounds[state.bracket.rounds.length - 1][0];
      state.bracket.champion = finalM && finalM.winner ? finalM.winner : null;
      const nextM = findNextMatch(state.bracket.rounds);
      state.bracket.currentMatchId = nextM ? nextM.id : null;

      const updatedLive = nextM ? createMatchLiveState(nextM) : {
        matchId: m.id, p1: m.p1, p2: m.p2, s1: m.s1, s2: m.s2,
        question: state.bracket.champion ? `🏆 بطل VOID: ${state.bracket.champion.name}` : 'انتهت البطولة',
        qIndex: -1, hits: [], endsAt: 0, status: 'finished'
      };
      broadcast('tourn_sync', { players: state.players, bracket: state.bracket, liveMatch: updatedLive });
      break;
    }
  }

  function updateLiveMatch(partial) {
    state.liveMatch = { ...state.liveMatch, ...partial };
    broadcast('live_match_update', { liveMatch: state.liveMatch });
  }

  function nextQuestion() {
    if (!state.me.isHost || state.liveMatch.status !== 'playing') return;
    const q = pickQuestion();
    updateLiveMatch({ question: q.question, qIndex: q.qIndex, hits: [], endsAt: Date.now() + 45000 });
  }

  function submitGuess(rawGuess) {
    const clean = (rawGuess || '').trim().slice(0, 40);
    const lm = state.liveMatch;
    if (!clean || lm.status !== 'playing' || state.role !== 'player') return;
    const isP1 = lm.p1 && lm.p1.id === state.me.id;
    const isP2 = lm.p2 && lm.p2.id === state.me.id;
    if (!isP1 && !isP2) {
      toast('أنت لست طرفاً في المواجهة الحالية');
      return;
    }
    if (state.me.isHost) {
      handleMatchGuess(state.me.id, state.me.name, clean);
    } else if (state.net) {
      state.net.emit('tourn_guess', { userId: state.me.id, name: state.me.name, guess: clean });
    }
  }

  function handleMatchGuess(userId, userName, guess) {
    if (!state.me.isHost) return;
    const lm = state.liveMatch;
    if (!lm || lm.status !== 'playing' || lm.qIndex < 0 || lm.qIndex >= QS.length) return;
    const isP1 = lm.p1 && lm.p1.id === userId;
    const isP2 = lm.p2 && lm.p2.id === userId;
    if (!isP1 && !isP2) return;

    const k = matchAnswer(lm.qIndex, guess);
    if (k === undefined) {
      if (userId === state.me.id) { sfx.bad(); toast('إجابة غير موجودة ❌'); }
      return;
    }
    const hits = Array.isArray(lm.hits) ? lm.hits.slice() : [];
    if (hits.some(h => h.k === k)) {
      if (userId === state.me.id) toast('تم كشف هذه الإجابة مسبقاً');
      return;
    }
    const pts = N - k;
    const answerText = nm(QS[lm.qIndex], k);
    hits.push({ k, pts, text: answerText, by: userName, userId });
    const s1 = (lm.s1 || 0) + (isP1 ? pts : 0);
    const s2 = (lm.s2 || 0) + (isP2 ? pts : 0);

    if (userId === state.me.id) {
      sfx.ok();
      floatPoints(`+${pts}`);
    }

    if (hits.length >= N) {
      recordMatchResult(lm.matchId, s1, s2);
    } else {
      updateLiveMatch({ s1, s2, hits });
    }
  }

  function startHostLoop() {
    if (state.timerId) clearInterval(state.timerId);
    state.timerId = setInterval(() => {
      const lm = state.liveMatch;
      if (state.me.isHost && lm && lm.status === 'playing' && lm.matchId) {
        // محاكاة ذكية للخصم الآلي إذا كان أحد طرفي المواجهة بوت
        const botSide = (lm.p1?.isBot ? lm.p1 : (lm.p2?.isBot ? lm.p2 : null));
        if (botSide && Math.random() < 0.14 && lm.qIndex >= 0) {
          const hits = Array.isArray(lm.hits) ? lm.hits : [];
          const avail = [0, 1, 2, 3, 4, 5, 6, 7].filter(idx => !hits.some(h => h.k === idx));
          if (avail.length) {
            const pick = avail[Math.floor(Math.random() * avail.length)];
            handleMatchGuess(botSide.id, botSide.name, nm(QS[lm.qIndex], pick));
          }
        }
        // إنهاء المباراة تلقائياً عند انتهاء الوقت
        if (lm.endsAt && Date.now() >= lm.endsAt) {
          recordMatchResult(lm.matchId, lm.s1 || 0, lm.s2 || 0);
        }
      }
      const timerEl = document.getElementById('tourn-timer');
      if (timerEl && state.liveMatch?.endsAt && state.liveMatch.status === 'playing') {
        const left = Math.max(0, Math.ceil((state.liveMatch.endsAt - Date.now()) / 1000));
        timerEl.textContent = `⏱️ ${left}ث`;
      }
    }, 1000);
  }

  function sendComment(text) {
    const clean = (text || '').trim().slice(0, 220);
    if (!clean || (state.chatLocked && !state.me.isMod) || state.bannedIds.includes(state.me.id)) return;
    broadcast('live_comment_add', {
      comment: {
        id: 'c_' + Date.now() + '_' + Math.random().toString(36).slice(2, 6),
        userId: state.me.id, name: state.me.name, avatar: state.me.avatar,
        frame: state.me.frame, nameColor: state.me.nameColor, isMod: state.me.isMod,
        text: clean, deleted: false
      }
    });
  }

  function moderateComment(commentId, action) {
    if (!state.me.isMod) return;
    const target = state.comments.find(c => c.id === commentId);
    if (action === 'delete') broadcast('live_mod_action', { action: 'delete', commentId });
    else if (action === 'ban' && target) broadcast('live_mod_action', { action: 'ban', targetUserId: target.userId });
    else if (action === 'unban' && target) broadcast('live_mod_action', { action: 'unban', targetUserId: target.userId });
    else if (action === 'toggle_lock') broadcast('live_mod_action', { action: 'toggle_lock', locked: !state.chatLocked });
  }

  function broadcast(type, data) {
    applyEvent(type, data);
    if (state.net) state.net.emit(type, data);
  }

  function applyEvent(type, data) {
    if (type === 'tourn_presence') {
      const { user, role } = data || {};
      if (!user?.id) return;
      state.players = state.players.filter(p => p.id !== user.id);
      state.spectators = state.spectators.filter(s => s.id !== user.id);
      (role === 'spectator' ? state.spectators : state.players).push(user);
      if (state.me.isHost && state.net) {
        state.net.emit('tourn_sync', {
          players: state.players, bracket: state.bracket, liveMatch: state.liveMatch,
          bannedIds: state.bannedIds, chatLocked: state.chatLocked
        });
      }
    } else if (type === 'tourn_guess') {
      if (state.me.isHost && data) handleMatchGuess(data.userId, data.name, data.guess);
      return;
    } else if (type === 'tourn_sync') {
      if (Array.isArray(data.players) && data.players.length) state.players = data.players;
      if (data.bracket) state.bracket = data.bracket;
      if (data.liveMatch) state.liveMatch = data.liveMatch;
      if (Array.isArray(data.bannedIds)) state.bannedIds = data.bannedIds;
      if (typeof data.chatLocked === 'boolean') state.chatLocked = data.chatLocked;
    } else if (type === 'live_match_update' && data.liveMatch) {
      state.liveMatch = data.liveMatch;
    } else if (type === 'live_comment_add' && data.comment) {
      if (!state.comments.some(c => c.id === data.comment.id)) {
        state.comments = [...state.comments.slice(-79), data.comment];
      }
    } else if (type === 'live_mod_action') {
      if (data.action === 'delete') {
        state.comments = state.comments.map(c => c.id === data.commentId ? { ...c, deleted: true, text: 'تم حذف التعليق بواسطة الإشراف' } : c);
      } else if (data.action === 'ban' && data.targetUserId) {
        if (!state.bannedIds.includes(data.targetUserId)) state.bannedIds.push(data.targetUserId);
        state.comments = state.comments.map(c => c.userId === data.targetUserId ? { ...c, deleted: true, text: 'تم إيقاف المشارك بواسطة الإشراف' } : c);
      } else if (data.action === 'unban') {
        state.bannedIds = state.bannedIds.filter(id => id !== data.targetUserId);
      } else if (data.action === 'toggle_lock') {
        state.chatLocked = !!data.locked;
      }
    }
    if (typeof state.onUpdate === 'function') state.onUpdate(state);
  }

  async function joinRoom(roomCode, role = 'player', isHost = false) {
    if (state.net?.close) state.net.close();
    state.code = roomCode.toLowerCase();
    state.role = role;
    state.me = {
      id: (typeof CU !== 'undefined' && CU?.uid) ? CU.uid : state.me.id,
      name: P.n || 'لاعب VOID',
      avatar: P.a || 0,
      frame: P.f || 0,
      nameColor: P.c || 0,
      isHost: !!isHost,
      isMod: !!isHost
    };
    const net = await fbJoin(state.code);
    state.net = net;
    ['tourn_presence', 'tourn_guess', 'tourn_sync', 'live_match_update', 'live_comment_add', 'live_mod_action'].forEach(ev => {
      net.on(ev, m => { if (!m.isMe) applyEvent(ev, m.data); });
    });
    syncPresence();
    startHostLoop();
    if (state.onUpdate) state.onUpdate(state);
  }

  function startAutoTournament() {
    const pool = state.players.filter(p => !p.isBot);
    const bots = ['نجم_VOID', 'سراب', 'طيف', 'صقر'];
    for (let i = pool.length; i < 4; i++) {
      pool.push({ id: 'bot_' + i + '_' + Math.random().toString(36).slice(2, 5), name: bots[i], avatar: i + 1, frame: 1, nameColor: 1, isHost: false, isMod: false, isBot: true });
    }
    const bracket = generateBracket(pool);
    const nextM = findNextMatch(bracket.rounds);
    const liveMatch = createMatchLiveState(nextM);
    broadcast('tourn_sync', { players: pool, bracket, liveMatch });
  }

  function leave() {
    if (state.timerId) clearInterval(state.timerId);
    state.timerId = null;
    if (state.net?.close) state.net.close();
    state.net = null;
    state.code = null;
  }

  function getRoundLabel(idx, total) {
    const d = total - 1 - idx;
    return d === 0 ? 'النهائي 🏆' : d === 1 ? 'نصف النهائي 🔥' : 'ربع النهائي ⚡';
  }

  function render(container) {
    if (!container) return;
    const canManage = state.me.isHost || state.me.isMod;
    const rCount = state.bracket?.rounds?.length || 0;
    const userBadge = u => `${avh(u.avatar || 0, u.frame || 0, false)} <span class="nc${u.nameColor || 0}">${esc(u.name)}</span>${u.isMod ? ' <span class="mod-tag">إشراف</span>' : ''}`;

    const bracketHtml = state.bracket ? `
      <div class="card">
        <div class="tourn-head">
          <h3>🏆 شجرة البطولة التلقائية</h3>
          <span class="tourn-pill">${state.bracket.champion ? 'البطل: ' + esc(state.bracket.champion.name) : 'جارية'}</span>
        </div>
        <div class="bracket-grid ${rCount > 1 ? 'two-col' : ''}">
          ${state.bracket.rounds.map((matches, rIdx) => `
            <div class="round-box">
              <div class="round-title"><span>${getRoundLabel(rIdx, rCount)}</span><small>${matches.length} مباراة</small></div>
              ${matches.map(m => `
                <div class="match-card ${state.bracket.currentMatchId === m.id ? 'active' : ''}">
                  <div class="match-player ${m.winner && m.p1 && m.winner.id === m.p1.id ? 'win' : (m.winner ? 'out' : '')}">
                    <div style="display:flex;align-items:center;gap:6px">${m.p1 ? userBadge(m.p1) : '<span style="color:var(--mut)">بانتظار المتأهل...</span>'}</div>
                    <span class="match-score">${m.p1 ? m.s1 : '-'}</span>
                  </div>
                  <div class="match-player ${m.winner && m.p2 && m.winner.id === m.p2.id ? 'win' : (m.winner ? 'out' : '')}">
                    <div style="display:flex;align-items:center;gap:6px">${m.p2 ? userBadge(m.p2) : '<span style="color:var(--mut)">بانتظار المتأهل...</span>'}</div>
                    <span class="match-score">${m.p2 ? m.s2 : '-'}</span>
                  </div>
                  ${(canManage && m.p1 && m.p2 && !m.winner) ? `
                    <div style="display:flex;gap:6px;margin-top:8px">
                      <button type="button" class="ok mod-btn" style="flex:1" onclick="VOID_LIVE.recordMatchResult('${m.id}',${m.s1 + 1},${m.s2},'${m.p1.id}')">فوز ${esc(m.p1.name)}</button>
                      <button type="button" class="ok mod-btn" style="flex:1" onclick="VOID_LIVE.recordMatchResult('${m.id}',${m.s1},${m.s2 + 1},'${m.p2.id}')">فوز ${esc(m.p2.name)}</button>
                    </div>` : ''}
                </div>
              `).join('')}
            </div>
          `).join('')}
        </div>
      </div>` : '';

    const lm = state.liveMatch;
    const isBanned = state.bannedIds.includes(state.me.id);
    const isMyTurn = lm.status === 'playing' && state.role === 'player' && ((lm.p1 && lm.p1.id === state.me.id) || (lm.p2 && lm.p2.id === state.me.id));
    const hits = Array.isArray(lm.hits) ? lm.hits : [];
    const timeLeft = (lm.endsAt && lm.status === 'playing') ? Math.max(0, Math.ceil((lm.endsAt - Date.now()) / 1000)) : 0;

    const slotsHtml = lm.status === 'playing' ? `
      <div class="sg" style="margin:10px 0">
        ${Array.from({ length: N }, (_, idx) => {
          const hit = hits.find(h => h.k === idx);
          return hit
            ? `<div class="slot f"><span><b>${idx + 1}.</b> ${esc(hit.text)} <small>— ${esc(hit.by)}</small></span><span class="pt">+${hit.pts}</span></div>`
            : `<div class="slot"><span><b>${idx + 1}.</b> ؟؟؟</span><span class="pt">${N - idx}</span></div>`;
        }).join('')}
      </div>` : '';

    container.innerHTML = `
      <div class="tourn-wrap">
        <div class="card">
          <div class="tourn-head">
            <div><h2>⚔️ بطولة VOID</h2><small style="color:var(--mut)">كود الغرفة: <b style="color:var(--pri)">${esc(state.code)}</b></small></div>
            <div style="display:flex;gap:6px;flex-wrap:wrap">
              <button type="button" class="o mod-btn" onclick="VOID_LIVE.setRole('player')">لاعب</button>
              <button type="button" class="o mod-btn" onclick="VOID_LIVE.setRole('spectator')">مشاهد</button>
              ${canManage ? `<button type="button" class="mod-btn" onclick="VOID_LIVE.startAutoTournament()">توزيع تلقائي</button>` : ''}
            </div>
          </div>
        </div>

        <div class="spec-banner">
          <div class="tourn-head">
            <span class="tourn-pill live">● مشاهدة مباشرة ${lm.status === 'playing' ? `<b id="tourn-timer" style="margin-right:6px">⏱️ ${timeLeft}ث</b>` : ''}</span>
            <span class="tourn-pill">👁️ ${state.spectators.length} مشاهد · 🎮 ${state.players.length} لاعب</span>
          </div>
          <div class="q" style="font-size:17px;text-align:center;margin:10px 0 6px">${esc(lm.question)}</div>
          <div class="spec-vs">
            <div class="spec-box"><div>${lm.p1 ? userBadge(lm.p1) : 'اللاعب 1'}</div><div class="sc">${lm.s1}</div></div>
            <div class="spec-mid">VS</div>
            <div class="spec-box"><div>${lm.p2 ? userBadge(lm.p2) : 'اللاعب 2'}</div><div class="sc">${lm.s2}</div></div>
          </div>
          ${slotsHtml}
          ${isMyTurn ? `
            <form class="chat-form" style="margin-top:10px" onsubmit="event.preventDefault();const i=this.querySelector('input');VOID_LIVE.submitGuess(i.value);i.value='';">
              <input type="text" placeholder="اكتب إجابتك في المواجهة الآن..." maxlength="40" autocomplete="off">
              <button type="submit">إرسال الإجابة</button>
            </form>` : (lm.status === 'playing' ? `<p class="s" style="margin:8px 0 0">أنت تشاهد هذه المواجهة مباشرة 👀</p>` : '')}
          ${(canManage && lm.matchId && lm.status === 'playing') ? `
            <div style="display:flex;gap:6px;margin-top:10px;flex-wrap:wrap">
              <button type="button" class="o mod-btn" style="flex:1" onclick="VOID_LIVE.nextQuestion()">سؤال جديد 🔄</button>
              <button type="button" class="ok mod-btn" style="flex:1" onclick="VOID_LIVE.recordMatchResult(VOID_LIVE.getState().liveMatch.matchId,VOID_LIVE.getState().liveMatch.s1,VOID_LIVE.getState().liveMatch.s2)">حسم الجولة 🏆</button>
            </div>` : ''}
        </div>

        ${bracketHtml}

        <div class="chat-box">
          <div class="tourn-head">
            <h3>💬 التعليقات المباشرة</h3>
            <div style="display:flex;gap:6px;align-items:center">
              <span class="tourn-pill">${state.chatLocked ? '🔒 مقفلة' : '🔓 مفتوحة'}</span>
              ${state.me.isMod ? `<button type="button" class="o mod-btn" onclick="VOID_LIVE.moderateComment(null,'toggle_lock')">${state.chatLocked ? 'فتح' : 'قفل'}</button>` : ''}
            </div>
          </div>
          <div class="chat-list" id="void-chat-list">
            ${state.comments.length ? state.comments.map(c => {
              const muted = state.bannedIds.includes(c.userId);
              return `
                <div class="chat-msg ${(c.deleted || muted) ? 'muted' : ''}">
                  <div class="chat-body">
                    <div class="chat-author">${userBadge(c)}</div>
                    <div class="chat-text">${esc(c.text)}</div>
                  </div>
                  ${state.me.isMod ? `
                    <div class="mod-actions">
                      ${!c.deleted ? `<button type="button" class="bad mod-btn" onclick="VOID_LIVE.moderateComment('${c.id}','delete')">حذف</button>` : ''}
                      ${!muted
                        ? `<button type="button" class="o mod-btn" onclick="VOID_LIVE.moderateComment('${c.id}','ban')">كتم</button>`
                        : `<button type="button" class="ok mod-btn" onclick="VOID_LIVE.moderateComment('${c.id}','unban')">فك</button>`}
                    </div>` : ''}
                </div>`;
            }).join('') : `<p class="s" style="margin:10px 0">لا توجد تعليقات بعد. اكتب أول تعليق!</p>`}
          </div>
          <form class="chat-form" onsubmit="event.preventDefault();const i=this.querySelector('input');VOID_LIVE.sendComment(i.value);i.value='';">
            <input type="text" placeholder="${isBanned ? 'تم إيقافك من التعليق' : (state.chatLocked && !state.me.isMod ? 'المحادثة مقفلة' : 'اكتب تعليقك المباشر...')}" ${(isBanned || (state.chatLocked && !state.me.isMod)) ? 'disabled' : ''}>
            <button type="submit" ${(isBanned || (state.chatLocked && !state.me.isMod)) ? 'disabled' : ''}>إرسال</button>
          </form>
        </div>

        <button type="button" class="o" onclick="VOID_LIVE.leave();home()">مغادرة البطولة</button>
      </div>`;
    const list = container.querySelector('#void-chat-list');
    if (list) list.scrollTop = list.scrollHeight;
  }

  function setRole(role) {
    state.role = role === 'spectator' ? 'spectator' : 'player';
    syncPresence();
    if (state.onUpdate) state.onUpdate(state);
  }

  return {
    joinRoom, setRole, startAutoTournament, recordMatchResult, updateLiveMatch,
    nextQuestion, submitGuess, sendComment, moderateComment, render, leave,
    onUpdate: fn => { state.onUpdate = fn; },
    getState: () => state
  };
})();

function openTournamentModal() {
  const m = mkModal(`
    <h3>🏆 البطولات والمشاهدة المباشرة</h3>
    <button id="t-new">إنشاء بطولة جديدة (مضيف)</button>
    <input id="t-code" placeholder="كود البطولة للانضمام أو المشاهدة" maxlength="8" style="direction:ltr;text-align:center;margin-top:10px">
    <div style="display:flex;gap:8px">
      <button id="t-play" style="flex:1">انضمام كلاعب</button>
      <button class="o" id="t-watch" style="flex:1">مشاهدة مباشرة 👁️</button>
    </div>
    <button class="o" id="t-close">إلغاء</button>
  `);
  const launch = async (c, role, isHost) => {
    m.remove();
    S.phase = 'tournament';
    VOID_LIVE.onUpdate(() => VOID_LIVE.render(app));
    await VOID_LIVE.joinRoom(c, role, isHost);
    if (isHost) VOID_LIVE.startAutoTournament();
  };
  m.querySelector('#t-close').onclick = () => m.remove();
  m.querySelector('#t-new').onclick = () => launch(code(), 'player', true);
  m.querySelector('#t-play').onclick = () => {
    const c = m.querySelector('#t-code').value.trim().toLowerCase();
    if (c) launch(c, 'player', false);
  };
  m.querySelector('#t-watch').onclick = () => {
    const c = m.querySelector('#t-code').value.trim().toLowerCase();
    if (c) launch(c, 'spectator', false);
  };
}

home();
presence();
authInit();
</script>
</body>
</html>

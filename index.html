<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>VOID | تحدي الأصدقاء</title>
<meta name="theme-color" content="#0a090d">
<meta name="mobile-web-app-capable" content="yes">
<style>
:root{
  --bg:#0a090d;
  --card:#141319;
  --card2:#1b1924;
  --tx:#f1eefa;
  --mut:#9a95ad;
  --pri:#9b6bff;
  --pri2:#7c3aed;
  --acc:#c026d3;
  --ok:#2fbf71;
  --bad:#ff5d6c;
  --gold:#fbbf24;
  --bd:#2a2738;
  color-scheme:dark;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px)
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{
  margin:0;
  background:radial-gradient(circle at 50% 0%,#160e29 0%,var(--bg) 55%);
  color:var(--tx);
  font-family:system-ui,-apple-system,"Segoe UI",Tahoma,sans-serif;
  min-height:100vh;
  -webkit-user-select:none;
  user-select:none;
  touch-action:manipulation;
  overflow-x:hidden
}
main{max-width:500px;margin:0 auto;padding:16px 14px 28px}
h1,h2,h3{margin:0}
p.s{color:var(--mut);text-align:center;margin:0 0 14px;line-height:1.5}
.card{
  background:linear-gradient(180deg,rgba(26,24,35,.92),rgba(20,19,25,.96));
  backdrop-filter:blur(10px);
  border:1px solid var(--bd);
  border-radius:18px;
  padding:15px;
  margin-bottom:13px;
  box-shadow:0 8px 24px #0000004d,inset 0 1px 0 #ffffff0d
}
input{
  width:100%;
  padding:13px 14px;
  border-radius:13px;
  border:1px solid var(--bd);
  background:#0d0c12;
  color:var(--tx);
  font-size:16px;
  margin-bottom:10px;
  font-family:inherit;
  -webkit-user-select:text;
  user-select:text;
  transition:border-color .2s,box-shadow .2s
}
input:focus{outline:none;border-color:var(--pri);box-shadow:0 0 0 3px #9b6bff2b}
button{
  width:100%;
  padding:13px 16px;
  border-radius:13px;
  border:0;
  background:linear-gradient(135deg,var(--pri2),#a06bff);
  color:#fff;
  font-size:16px;
  font-weight:700;
  font-family:inherit;
  cursor:pointer;
  margin-top:4px;
  transition:transform .12s,filter .15s,box-shadow .2s;
  box-shadow:0 4px 14px #7c3aed40
}
button:hover:not(:disabled){filter:brightness(1.07)}
button:active:not(:disabled){transform:scale(.97)}
button:disabled{opacity:.45;cursor:not-allowed;box-shadow:none}
button.o{
  background:var(--card2);
  color:var(--tx);
  border:1px solid var(--bd);
  text-align:right;
  margin-top:8px;
  box-shadow:none;
  font-weight:600
}
button.ok{background:linear-gradient(135deg,#16a34a,var(--ok));color:#fff;border-color:var(--ok)}
button.bad{background:linear-gradient(135deg,#dc2626,var(--bad));color:#fff;border-color:var(--bad)}
.q{font-size:20px;font-weight:700;line-height:1.45;margin:6px 0 10px}
.top{display:flex;justify-content:space-between;align-items:center;color:var(--mut);font-size:13px;gap:8px}
.bar{height:7px;background:#201d2c;border-radius:999px;overflow:hidden;margin:8px 0}
.bar i{display:block;height:100%;background:linear-gradient(90deg,var(--pri2),#c084fc);width:100%;transition:width .25s linear;border-radius:999px}
.bar.low i{background:linear-gradient(90deg,#ef4444,#f97316)}
.tgt i{background:linear-gradient(90deg,#f59e0b,#fbbf24);width:0}
.tgt i.ok{background:linear-gradient(90deg,#10b981,#34d399)}
.row{display:flex;justify-content:space-between;align-items:center;padding:10px 4px;border-bottom:1px solid var(--bd);gap:8px}
.row:last-child{border:0}
.code{font-size:32px;letter-spacing:4px;text-align:center;font-weight:800;direction:ltr;color:var(--pri);text-shadow:0 0 16px #9b6bff55}
.hide{display:none}
.slot{
  display:flex;
  justify-content:space-between;
  align-items:center;
  padding:9px 10px;
  border:1px dashed var(--bd);
  border-radius:12px;
  color:var(--mut);
  font-size:13.5px;
  gap:6px;
  background:#0f0e1480
}
.slot.f{
  border:1px solid #2fbf7188;
  color:var(--tx);
  background:linear-gradient(135deg,rgba(47,191,113,.16),rgba(16,185,129,.06))
}
.slot.hinted{
  border:1px dashed #fbbf2488;
  color:#fde68a;
  background:rgba(245,158,11,.08)
}
.slot small{color:var(--mut);font-size:11px}
.pt{font-weight:800;color:var(--pri);white-space:nowrap}

/* Hero Banner with Animated Starfield */
.hero{
  position:relative;
  height:156px;
  border-radius:22px;
  overflow:hidden;
  margin-bottom:14px;
  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:center;
  background:radial-gradient(circle at 50% 50%,#000 0 24%,#12062b 25% 32%,transparent 34%),
             conic-gradient(from 20deg at 50% 50%,#12062b,#7c3aed,#220c4d,#c4a1ff,#12062b,#6d28d9,#12062b);
  border:1px solid #3a3154;
  box-shadow:0 12px 32px #00000066,0 0 24px #7c3aed26;
  cursor:pointer
}
.hero canvas{position:absolute;inset:0;width:100%;height:100%;pointer-events:none}
.hero b{
  position:relative;
  font:800 52px Georgia,"Times New Roman",serif;
  letter-spacing:10px;
  color:#efe8ff;
  text-shadow:0 0 22px #9b6bff,0 2px 0 #000;
  direction:ltr;
  margin-right:-10px
}
.hero span{position:relative;font-size:13px;color:#d6cbff;margin-top:3px;font-weight:600}

.chip{
  display:inline-flex;
  align-items:center;
  gap:4px;
  background:#1c1a26;
  border:1px solid var(--bd);
  color:var(--mut);
  border-radius:999px;
  padding:6px 12px;
  font-size:13px;
  cursor:pointer;
  transition:all .15s
}
.chip.on{background:var(--pri);color:#fff;border-color:var(--pri);font-weight:700}
.cr{text-align:center;color:var(--mut);font-size:13px;margin:20px 0 6px}
.cr b{color:var(--pri)}
.sg{display:grid;grid-template-columns:1fr 1fr;gap:7px}
.sg .slot{margin:0}
.sg .slot span:first-child{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.play .hero,.play .cr,.play .onl{display:none}
.play main{padding:10px 12px}
.chips{display:flex;gap:6px;overflow-x:auto;margin-top:10px;padding-bottom:2px}
.chips .chip{white-space:nowrap;padding:4px 10px}
.dock{
  position:sticky;
  bottom:0;
  background:linear-gradient(180deg,transparent,var(--bg) 22%);
  padding:8px 0 6px;
  display:flex;
  gap:8px;
  z-index:10
}
.dock input{margin:0;flex:1}
.dock button{width:auto;margin:0;padding:0 20px}
.chips2{display:flex;flex-wrap:wrap;gap:7px}
.onl{text-align:center;color:var(--mut);font-size:13px;margin:-4px 0 12px}

/* Avatars & Frames */
.av{
  position:relative;
  display:inline-flex;
  align-items:center;
  justify-content:center;
  width:34px;
  height:34px;
  border-radius:50%;
  margin-inline-end:7px;
  flex:none;
  vertical-align:middle;
  font-size:18px;
  box-shadow:0 0 var(--gb,0px) var(--gl,transparent),0 3px 5px #0008
}
.av::before{
  content:"";
  position:absolute;
  inset:0;
  border-radius:50%;
  background:var(--g,linear-gradient(135deg,#3a3650,#1d1b27));
  animation:spin var(--sp,90s) linear infinite
}
.av i{
  position:relative;
  z-index:1;
  display:flex;
  align-items:center;
  justify-content:center;
  width:calc(100% - 7px);
  height:calc(100% - 7px);
  border-radius:50%;
  font-style:normal;
  overflow:hidden;
  box-shadow:inset 0 3px 5px #ffffff59,inset 0 -5px 8px #00000080
}
.av i svg{width:100%;height:100%;display:block}
.av i::after{content:"";position:absolute;inset:0;border-radius:50%;background:radial-gradient(circle at 30% 22%,#ffffff66,transparent 46%)}
.av.big{width:76px;height:76px;font-size:40px;margin:0}
.av.big i{width:calc(100% - 10px);height:calc(100% - 10px)}
.chip .av{width:22px;height:22px;font-size:12px;margin-inline-end:4px}
.sg .av{width:20px;height:20px;font-size:11px;margin-inline-end:4px}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes pls{50%{box-shadow:0 0 calc(var(--gb,10px)*2.2) var(--gl),0 3px 5px #0008}}
@keyframes flow{to{background-position:300% 0}}
@keyframes flk{0%,100%{opacity:1}50%{opacity:.75}}
.fr1{--g:conic-gradient(#fff6c2,#e0a82e,#8a5a00,#ffe27a,#e0a82e,#fff6c2);--gl:#ffcc33;--gb:8px}
.fr2{--g:conic-gradient(#fff,#9aa5b1,#4b5563,#e5e7eb,#9aa5b1,#fff);--gl:#cbd5e1;--gb:7px;--sp:6s}
.fr3{--g:conic-gradient(#ff2d00,#ff9500,#ffe000,#ff2d00);--gl:#ff5500;--gb:10px;--sp:1.8s;animation:pls 1.2s ease-in-out infinite}
.fr4{--g:conic-gradient(#e0f7ff,#38bdf8,#0369a1,#e0f7ff);--gl:#38bdf8;--gb:9px;--sp:4s}
.fr5{--g:conic-gradient(#a855f7,#3b82f6,#a855f7);--gl:#a855f7;--gb:12px;--sp:3s;animation:pls 1.8s ease-in-out infinite}
.fr6{--g:conic-gradient(#f43f5e,#facc15,#4ade80,#38bdf8,#a855f7,#f43f5e);--gl:#fff;--gb:6px;--sp:2.5s}
.fr7{--g:conic-gradient(#000,#7c3aed,#000,#c084fc,#000,#7c3aed);--gl:#7c3aed;--gb:14px;--sp:2s;animation:pls 2s ease-in-out infinite}
.fr8{--g:conic-gradient(#d1fae5,#10b981,#065f46,#6ee7b7,#10b981,#d1fae5);--gl:#10b981;--gb:9px;--sp:7s}
.fr9{--g:conic-gradient(#ffd166,#a855f7,#ffd166,#6d28d9);--gl:#e9b949;--gb:11px;--sp:3.5s}
.fr10{--g:conic-gradient(#fff,#fde047,#fff,#60a5fa,#fff);--gl:#fde047;--gb:12px;--sp:1s;animation:pls .8s ease-in-out infinite}
.fr11{--g:conic-gradient(#f5d0fe,#c026d3,#6d28d9,#fff,#a855f7,#f5d0fe);--gl:#c026d3;--gb:16px;--sp:2s;animation:pls 1.3s ease-in-out infinite}
.fr11::after{content:"";position:absolute;inset:-26%;border-radius:50%;z-index:0;pointer-events:none;background:repeating-conic-gradient(from 0deg,#e879f9 0 7deg,#7c3aed 7deg 12deg,transparent 12deg 24deg);-webkit-mask:radial-gradient(circle closest-side,transparent 66%,#000 70%,#000 82%,transparent 100%);mask:radial-gradient(circle closest-side,transparent 66%,#000 70%,#000 82%,transparent 100%);filter:drop-shadow(0 0 5px #c026d3);animation:flame 4s linear infinite}
@keyframes flame{0%{transform:rotate(0) scale(1)}25%{transform:rotate(90deg) scale(1.1)}50%{transform:rotate(180deg) scale(.95)}75%{transform:rotate(270deg) scale(1.12)}100%{transform:rotate(360deg) scale(1)}}

/* Name Colors */
.nc0{color:#f1eefa}.nc1{color:#ffd166}.nc2{color:#ff6b7a}.nc3{color:#4ade80}.nc4{color:#60a5fa}.nc5{color:#f472b6}
.nc6,.nc7,.nc9,.nc10,.nc11,.nc12,.nc13,.nc14{-webkit-background-clip:text;background-clip:text;color:transparent;display:inline-block;font-weight:800}
.nc6{background-image:linear-gradient(90deg,#ff5e62,#ff9966,#ffd166)}
.nc7{background-image:linear-gradient(90deg,#00c6ff,#0072ff,#7f5af0)}
.nc8{color:#39ff14;text-shadow:0 0 6px #39ff14,0 0 14px #1fbf0a;animation:flk 1.6s infinite;font-weight:700}
.nc9{background-image:linear-gradient(90deg,#f43f5e,#facc15,#4ade80,#38bdf8,#a855f7,#f43f5e);background-size:300% 100%;animation:flow 3s linear infinite}
.nc10{background-image:linear-gradient(90deg,#ff2d00,#ff9500,#ffe000,#ff9500,#ff2d00);background-size:300% 100%;animation:flow 2s linear infinite}
.nc11{background-image:linear-gradient(90deg,#9bdcff,#fff,#38bdf8,#fff,#9bdcff);background-size:300% 100%;animation:flow 2.5s linear infinite}
.nc12{background-image:linear-gradient(90deg,#7c3aed,#f472b6,#38bdf8,#7c3aed);background-size:300% 100%;animation:flow 3s linear infinite;filter:drop-shadow(0 0 6px #7c3aed)}
.nc13{background-image:linear-gradient(90deg,#b8860b,#ffe27a,#fff6c2,#ffe27a,#b8860b);background-size:300% 100%;animation:flow 2.2s linear infinite;filter:drop-shadow(0 0 5px #e0a82e)}
.nc14{background-image:linear-gradient(90deg,#c026d3,#f5d0fe,#7c3aed,#e879f9,#c026d3);background-size:300% 100%;animation:flow 2s linear infinite;filter:drop-shadow(0 0 7px #a855f7)}
.vb{display:inline-flex;align-items:center;justify-content:center;width:16px;height:16px;border-radius:50%;background:linear-gradient(135deg,#c026d3,#6366f1);color:#fff;font-size:10px;font-weight:700;margin-inline-start:5px;box-shadow:0 0 8px #a855f7;vertical-align:middle}

/* Shop & Grids */
.gr3{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.it{background:var(--bg);border:1px solid var(--bd);border-radius:14px;padding:10px 4px;text-align:center;cursor:pointer;font-size:13px;transition:transform .12s,border-color .2s}
.it:active{transform:scale(.96)}
.it .av{margin:0 auto 8px;width:54px;height:54px;font-size:28px}
.it.sel{border-color:var(--pri);box-shadow:0 0 0 1px var(--pri);background:#1b1629}
.it b{display:block;margin-top:4px;color:var(--pri)}

/* Animations & Effects */
#app>*{animation:rise .3s ease both}
@keyframes rise{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
@keyframes pop{0%{transform:scale(.86)}60%{transform:scale(1.05)}100%{transform:scale(1)}}
@keyframes shk{25%{transform:translateX(-7px)}75%{transform:translateX(7px)}}
@keyframes fall{to{transform:translateY(108vh) rotate(720deg)}}
@keyframes floatUp{0%{opacity:1;transform:translate(-50%,0) scale(.8)}30%{transform:translate(-50%,-18px) scale(1.15)}100%{opacity:0;transform:translate(-50%,-52px) scale(1)}}
.slot.new{animation:pop .4s ease}
.sk{animation:shk .3s}

/* Tiles & Cards */
.tiles{display:grid;gap:10px;margin-bottom:13px}
.tile{
  display:flex;
  align-items:center;
  justify-content:space-between;
  text-align:right;
  padding:15px 16px;
  border-radius:18px;
  border:1px solid #ffffff26;
  margin:0;
  color:#fff;
  position:relative;
  overflow:hidden
}
.tile-info{display:flex;flex-direction:column;gap:3px}
.tile b{font-size:17px}
.tile small{opacity:.9;font-size:12.5px;font-weight:500}
.tile-ico{font-size:30px;filter:drop-shadow(0 4px 8px #0005)}
.t1{background:linear-gradient(135deg,#6d28d9,#c026d3)}
.t2{background:linear-gradient(135deg,#0284c7,#4f46e5)}
.t3{background:linear-gradient(135deg,#059669,#0d9488)}
.t4{background:linear-gradient(135deg,#d97706,#ea580c)}

.note{background:#3b2a12;border:1px solid #7a5a1c;color:#fcd34d;border-radius:13px;padding:10px;text-align:center;font-size:13px;margin-bottom:12px;font-weight:600}

/* World & Stage Map */
.world-card{
  background:var(--card);
  border:1px solid var(--bd);
  border-radius:18px;
  padding:14px;
  margin-bottom:12px
}
.world-hd{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px}
.world-title{display:flex;align-items:center;gap:8px;font-weight:800;font-size:16px}
.world-badge{font-size:12px;background:#ffffff12;padding:3px 9px;border-radius:999px;color:var(--gold);font-weight:700}
.lvg{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.lvb{
  margin:0;
  padding:10px 6px;
  background:var(--card2);
  border:1px solid var(--bd);
  color:var(--tx);
  border-radius:14px;
  display:flex;
  flex-direction:column;
  align-items:center;
  gap:3px;
  box-shadow:none;
  position:relative
}
.lvb b{font-size:18px;line-height:1.1}
.lvb .qtag{font-size:11px;color:var(--mut);background:#00000045;padding:2px 7px;border-radius:999px;font-weight:600}
.lvb small{color:var(--gold);font-size:12px;letter-spacing:1px}
.lvb.dn{border-color:#fbbf2466;background:linear-gradient(180deg,#241f33,#181522)}
.lvb.cur{border-color:var(--pri);box-shadow:0 0 14px #9b6bff33}
.lvb.lock{opacity:.42}

/* Powerups & Combo */
.pw-bar{display:grid;grid-template-columns:repeat(3,1fr);gap:7px;margin-top:8px}
.pw-btn{
  margin:0;
  padding:7px 4px;
  border-radius:11px;
  background:#1c1929;
  border:1px solid var(--bd);
  color:var(--tx);
  font-size:12px;
  font-weight:700;
  display:flex;
  flex-direction:column;
  align-items:center;
  gap:2px;
  box-shadow:none
}
.pw-btn span{font-size:15px}
.pw-btn small{color:var(--gold);font-size:10.5px}
.pw-btn.active{border-color:var(--gold);background:#3b2a12;color:#fde68a}
.combo-pill{
  display:inline-flex;
  align-items:center;
  gap:4px;
  padding:2px 9px;
  border-radius:999px;
  font-size:12px;
  font-weight:800;
  background:linear-gradient(90deg,#f97316,#ef4444);
  color:#fff;
  animation:pop .3s ease
}
.float-pt{
  position:fixed;
  left:50%;
  top:42%;
  z-index:90;
  font-size:26px;
  font-weight:900;
  color:#4ade80;
  text-shadow:0 3px 12px #000;
  pointer-events:none;
  animation:floatUp .9s cubic-bezier(.16,1,.3,1) forwards
}

.big{font-size:52px;font-weight:900;line-height:1;background:linear-gradient(135deg,#c4a1ff,#f0abfc);-webkit-background-clip:text;background-clip:text;color:transparent}
.stars{font-size:34px;color:var(--gold);letter-spacing:4px;margin:8px 0}
.cf{position:fixed;inset:0;pointer-events:none;overflow:hidden;z-index:60}
.cf i{position:absolute;top:-14px;width:8px;height:14px;border-radius:2px;animation:fall linear forwards}
.modal{position:fixed;inset:0;background:#000000cc;backdrop-filter:blur(6px);z-index:70;display:flex;align-items:center;justify-content:center;padding:18px}
.mc{background:var(--card);border:1px solid #38334d;border-radius:22px;padding:20px;max-width:430px;width:100%;max-height:86vh;overflow-y:auto;box-shadow:0 20px 50px #000}
.mc h3{margin:0 0 10px;font-size:19px}
.mc p{margin:6px 0;color:var(--mut);line-height:1.6;font-size:14px}
.ach-item{display:flex;align-items:center;gap:10px;padding:10px;border-radius:13px;background:var(--bg);border:1px solid var(--bd);margin-bottom:8px}
.ach-item.done{border-color:#2fbf7166;background:#12241c}
.ach-ico{font-size:26px;width:40px;height:40px;display:flex;align-items:center;justify-content:center;border-radius:12px;background:#ffffff0a;flex:none}

/* ===== VOID progression update ===== */
.progress-card{background:linear-gradient(135deg,#211638,#171321);border:1px solid #57417c;border-radius:16px;padding:13px;margin:10px 0}
.xp-track{height:9px;background:#0d0b13;border-radius:99px;overflow:hidden;margin-top:8px}
.xp-track i{display:block;height:100%;width:0;background:linear-gradient(90deg,#7c3aed,#e879f9);border-radius:99px;transition:width .3s}
.profile-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px;margin-top:10px}
.profile-stat{background:#0d0c12;border:1px solid var(--bd);border-radius:12px;padding:10px;text-align:center}
.profile-stat b{display:block;font-size:20px;color:var(--pri)}
.profile-stat small{color:var(--mut);font-size:11px}
.history-item{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:10px;border-bottom:1px solid var(--bd);font-size:13px}
.history-item:last-child{border-bottom:0}
.boss-tag{display:inline-flex;align-items:center;gap:5px;padding:4px 9px;border-radius:999px;background:#3b1825;border:1px solid #a33a5a;color:#fecdd3;font-size:12px;font-weight:800}
button:focus-visible,.chip:focus-visible,input:focus-visible{outline:2px solid #c4a1ff;outline-offset:3px}
@media(prefers-reduced-motion:reduce){*,*::before,*::after{animation-duration:.01ms!important;animation-iteration-count:1!important;scroll-behavior:auto!important;transition-duration:.01ms!important}}

</style>
</head>
<body>
<main>
  <div class="hero" id="hr">
    <canvas id="stars-cv"></canvas>
    <b>VOID</b>
    <span>تحدي الأصدقاء ... خمّن الإجابات قبل الجميع</span>
  </div>
  <div id="onl" class="onl"></div>
  <div id="app"></div>

/* ===== خلفية النجوم المتحركة في شعار VOID ===== */
(function initHeroStars(){
  const cv=document.getElementById('stars-cv');
  if(!cv)return;
  const ctx=cv.getContext('2d');
  let w=0,h=0,pts=[];
  function resize(){
    const r=cv.parentElement.getBoundingClientRect();
    w=cv.width=r.width*(window.devicePixelRatio||1);
    h=cv.height=r.height*(window.devicePixelRatio||1);
    pts=Array.from({length:36},()=>({
      x:Math.random()*w,y:Math.random()*h,
      r:(Math.random()*1.6+0.6)*(window.devicePixelRatio||1),
      vx:(Math.random()-.5)*0.25,vy:(Math.random()-.5)*0.25,
      a:Math.random()
    }));
  }
  resize();
  window.addEventListener('resize',resize);
  function tick(){
    ctx.clearRect(0,0,w,h);
    pts.forEach(p=>{
      p.x=(p.x+p.vx+w)%w;
      p.y=(p.y+p.vy+h)%h;
      p.a+=0.02;
      ctx.fillStyle=`rgba(255,255,255,${0.3+Math.abs(Math.sin(p.a))*0.7})`;
      ctx.beginPath();ctx.arc(p.x,p.y,p.r,0,Math.PI*2);ctx.fill();
    });
    requestAnimationFrame(tick);
  }
  requestAnimationFrame(tick);
})();

/* ===== نظام التحقق الخاص بالمطور ECDSA ===== */
const OWNER_PUB={"kty":"EC","crv":"P-256","x":"fzPjduY-8PtF_gAZvhZ1CICA1C32-l62oiB4ijjnAxU","y":"m54ac_EUpwedxs7cTVAM4S202DyOi6P_PPgPHq6NMV0"};
let O=null;try{O=localStorage.getItem('vo')}catch(e){}
const ef=(f,ok)=>f===11&&!ok?0:f,ec=(c,ok)=>c===14&&!ok?0:c;
const ALG={name:'ECDSA',namedCurve:'P-256'},SG={name:'ECDSA',hash:'SHA-256'};
async function signPeer(peer){
  const pk=await crypto.subtle.importKey('jwk',JSON.parse(O),ALG,false,['sign']);
  const s=new Uint8Array(await crypto.subtle.sign(SG,pk,new TextEncoder().encode(peer)));
  let b='';s.forEach(x=>b+=String.fromCharCode(x));return btoa(b);
}
async function chk(peer,sig){
  if(!sig||typeof sig!=='string'||sig.length>200)return;
  try{
    const vk=await crypto.subtle.importKey('jwk',OWNER_PUB,ALG,false,['verify']);
    const ok=await crypto.subtle.verify(SG,vk,Uint8Array.from(atob(sig),c=>c.charCodeAt(0)),new TextEncoder().encode(peer));
    if(ok&&S.players[peer]){S.players[peer].ok=true;refresh()}
  }catch(e){}
}
function refresh(){if(S.phase==='lobby')lobby();else if(S.phase==='q')draw()}

  const m=document.createElement('div');m.className='modal';
  m.innerHTML=`<div class="mc"><h3>${esc(title)}</h3><input id="pi" placeholder="${esc(placeholder)}" autocomplete="off"><div style="display:flex;gap:8px"><button id="pok">تأكيد</button><button id="pcn" class="o" style="margin:4px 0 0;text-align:center">إلغاء</button></div></div>`;
  document.body.appendChild(m);
  const inp=m.querySelector('#pi');inp.focus();
  m.querySelector('#pcn').onclick=()=>m.remove();
  m.querySelector('#pok').onclick=()=>{const v=inp.value;m.remove();cb(v)};
}

async function unlock(){
  customPrompt('وضع المطوّر','الصق مفتاح المطوّر هنا',async k=>{
    if(!k)return;
    try{
      const j=JSON.parse(k.trim());
      const pk=await crypto.subtle.importKey('jwk',j,ALG,false,['sign']);
      const s=await crypto.subtle.sign(SG,pk,new TextEncoder().encode('t'));
      const vk=await crypto.subtle.importKey('jwk',OWNER_PUB,ALG,false,['verify']);
      if(!(await crypto.subtle.verify(SG,vk,s,new TextEncoder().encode('t'))))throw 0;
      O=JSON.stringify(j);localStorage.setItem('vo',O);P.f=11;P.c=14;save();home();
    }catch(e){customAlert('المفتاح غير صحيح')}
  });
}

const dayBefore=key=>{const d=new Date(key+'T12:00:00');d.setDate(d.getDate()-1);return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`};
const playerLevel=()=>Math.floor((P.xp||0)/250)+1;
const xpIntoLevel=()=>(P.xp||0)%250;
function awardXP(amount,reason){
  const before=playerLevel();
  P.xp=Math.max(0,(P.xp||0)+Math.max(0,Math.floor(amount||0)));
  const gained=playerLevel()-before;
  if(gained>0)toast(`ارتقيت إلى المستوى ${playerLevel()}! 🎉`);
  return gained;
}
function addHistory(mode,score,passed,coins){
  P.history=Array.isArray(P.history)?P.history:[];
  P.history.unshift({mode:String(mode||'مباراة'),score:Math.max(0,score|0),passed:!!passed,coins:Math.max(0,coins|0),date:new Date().toISOString()});
  P.history=P.history.slice(0,30);
}
function updateDailyStreak(dayKey){
  if(P.lastDaily===dayKey)return false;
  P.streak=P.lastDaily===dayBefore(dayKey)?(P.streak||0)+1:1;
  P.lastDaily=dayKey;
  return true;
}

      o.connect(g);g.connect(AC.destination);
      o.start(t+i*d);o.stop(t+i*d+d)
    })
  }catch(e){}
}

const WORLDS=[
  {id:1,name:'عالم البدايات المتنوعة',ico:'🌟',cat:null,desc:'أسئلة عامة ممتعة لبداية رحلتك'},

  {id:4,name:'عالم المطبخ والنكهات',ico:'🍔',cat:'طعام',desc:'أكلات عربية، حلويات ومشروبات'},
  {id:5,name:'عالم العلوم والاكتشاف',ico:'🔬',cat:'علوم',desc:'فضاء، كائنات، عناصر واختراعات'},
  {id:6,name:'عالم الثقافة والأساطير',ico:'👑',cat:'ثقافة وترفيه',desc:'تحديات شاملة للمحترفين فقط'}
];
const LV=36;

function lvDef(L){
  const wIdx=Math.floor((L-1)/6);
  const sub=((L-1)%6)+1; // 1 إلى 6 داخل كل عالم
  const world=WORLDS[wIdx];
  // عدد الأسئلة المحددة لتجاوز كل مرحلة (يتدرج من 2 إلى 6 أسئلة)
  const nq=sub<=2?2:sub<=4?3:sub===5?4:5;
  const tm=Math.max(28,54-Math.floor(L*0.65));
  return{L,world,cat:L>30?null:world.cat,nq,tm,sub};
}
const lvTg=d=>Math.ceil(d.nq*(11+Math.floor(d.L*0.65))*(d.sub===6?1.18:1));

function lvQs(d,seedOffset=0){
  let x=(d.L*7919+13)+seedOffset;
  const r=()=>(x=(x*1103515245+12345)&0x7fffffff)/0x7fffffff;
  const ids=QS.map((q,i)=>i).filter(i=>!d.cat||QS[i][2]===d.cat);
  for(let j=ids.length-1;j>0;j--){
    const k=Math.floor(r()*(j+1));
    [ids[j],ids[k]]=[ids[k],ids[j]];
  }
  return ids.slice(0,d.nq);
}

let SS=null;
function solo(L){
  const d=lvDef(L);
  SS={L,d,tg:lvTg(d),qs:lvQs(d),i:0,score:0,hits:[],hinted:[],combo:0,x2:false};
  soloQ();

function soloSlots(show){
  const q=QS[SS.qid];let h='';
  for(let j=0;j<N;j++){
    const x=SS.hits.find(t=>t.k===j),pt=N-j;
    const isH=SS.hinted&&SS.hinted.includes(j);
    const ansText=nm(q,j);
    if(x){
      h+=`<div class="slot f ${x===SS.hits[SS.hits.length-1]&&!show?'new':''}">
        <span><b>${j+1}.</b> ${esc(ansText)}</span>
        <span class="pt">+${x.earned||pt}</span>
      </div>`;
    }else if(show){
      h+=`<div class="slot"><span><b>${j+1}.</b> ${esc(ansText)}</span><span class="pt">${pt}</span></div>`;
    }else if(isH){
      const clue=ansText[0]+'ـ'.repeat(Math.max(2,ansText.length-1))+` (${ansText.length})`;
      h+=`<div class="slot hinted"><span><b>${j+1}.</b> 💡 ${esc(clue)}</span><span class="pt">${pt}</span></div>`;
    }else{
      h+=`<div class="slot"><span><b>${j+1}.</b> ؟؟؟</span><span class="pt">${pt}</span></div>`;
    }
  }
  return h;
}

    if(SS.done)return;

    const hidden=[0,1,2,3,4,5,6,7].filter(k=>!SS.hits.some(h=>h.k===k)&&!SS.hinted.includes(k));
    if(!hidden.length)return toast('جميع الإجابات مكشوفة!');
    P.pw.hint--;save();
    SS.hinted.push(hidden[0]);
    sfx.pw();soloDraw();toast('تم كشف الحرف الأول لأحد الإجابات 💡');
  };
  $('#pw-time').onclick=()=>{

  $('#pw-x2').onclick=()=>{

    P.stats.ans=(P.stats.ans||0)+1;

    const basePts=N-k;
    const comboMult=SS.combo>=4?2:SS.combo>=3?1.5:SS.combo>=2?1.25:1;
    const x2Mult=SS.x2?2:1;
    const earned=Math.round(basePts*comboMult*x2Mult);

/* ===== نظام اللعب الجماعي (Firebase Multiplayer) محفوظ بالكامل ===== */
async function enter(c,host,auto){
  if(!online())return home('لا يوجد اتصال بالإنترنت');
  const n=P.n;
  if(!/^[a-z0-9]{2,8}$/.test(c)){$('#er').textContent='الكود غير صحيح';return}
  let room=null;
  try{room=await fbJoin(c)}catch(e){console.error(e)}
  if(!room){$('#er').textContent='تعذّر الاتصال بقاعدة البيانات. تأكد من إعدادات Firebase.';return}
  Object.assign(S,{name:n,host,room,code:c,players:{},hits:[],i:-1,auto:!!auto,combo:0,x2:false});
  room.on('join',m=>{
    if(!S.players[m.peer])S.players[m.peer]=Object.assign({n:String(m.data&&m.data.n||'لاعب').slice(0,16),s:0,o:String(m.data&&m.data.o||'').slice(0,200)},vp(m.data));
    chk(m.peer,m.data&&m.data.o);
    if(m.isMe&&m.sameTab)S.me=m.peer;
    if(S.host)room.emit('roster',Object.entries(S.players).map(([p,v])=>({p,n:v.n,s:v.s,a:v.a,f:v.f,c:v.c,o:v.o})));
    if(S.phase==='lobby')lobby();
  });
  room.on('roster',m=>{
    (m.data||[]).forEach(x=>{if(!S.players[x.p])S.players[x.p]=Object.assign({n:String(x.n).slice(0,16),s:x.s|0,o:String(x.o||'').slice(0,200)},vp(x));chk(x.p,x.o)});
    if(S.phase==='lobby')lobby();
  });
  room.on('q',m=>{
    const d=m.data||{};
    if(!(d.i>=0&&d.i<QS.length))return;
    S.i=d.i|0;S.r=d.r|0;S.nq=d.t|0;
    if(S.r===1){Object.values(S.players).forEach(p=>p.s=0);S.paid=false;S.earn=0}
    S.hits=[];S.hinted=[];S.dl=Date.now()+T;showQ();
  });
  room.on('guess',m=>{
    if(!S.host||S.phase!=='q'||!m.data||m.data.i!==S.i||S.hits.length>=N)return;
    const k=MAPS[S.i][norm(String(m.data.t).slice(0,40))];
    if(k===undefined)return room.emit('miss',{p:m.peer,r:'x'});
    if(S.hits.some(h=>h.k===k))return room.emit('miss',{p:m.peer,r:'d'});
    const pl=S.players[m.peer]||(S.players[m.peer]={n:'لاعب',s:0});
    const mult=m.data.x2?2:1;
    const h={k,p:m.peer,n:pl.n,pts:(N-k)*mult};
    applyHit(h);
    room.emit('hit',{i:S.i,...h});
    if(S.hits.length>=N)room.emit('end',{i:S.i});
  });
  room.on('hit',m=>{
    if(S.host||S.phase!=='q'||m.data.i!==S.i)return;
    const d=m.data;
    if(!S.players[d.p])S.players[d.p]={n:String(d.n).slice(0,16),s:0};
    applyHit({k:d.k|0,p:d.p,n:String(d.n).slice(0,16),pts:d.pts|0});
  });
  room.on('miss',m=>{
    if(m.data&&m.data.p===S.me){
      S.combo=0;sfx.bad();vib(50);
      toast(m.data.r==='d'?'سبقك أحدهم لهذه الإجابة 😅':'ليست من الإجابات ❌');
    }
  });
  room.on('leave',m=>{
    if(S.players[m.peer])delete S.players[m.peer];
    if(S.phase==='lobby')lobby();else if(S.phase==='q')draw();
  });
  room.on('end',m=>{if(S.phase==='q'&&m.data.i===S.i)finish()});
  let o='';if(O){try{o=await signPeer(room.me)}catch(e){}}
  room.emit('join',{n,a:P.a,f:P.f,c:P.c,o});
  lobby();
  if(S.auto&&S.host)startMM();
}

function leaveRoom(){
  if(S.room){
    try{S.room.emit('leave',{})}catch(e){}
    try{S.room.close()}catch(e){}
  }
  clearInterval(S.tm);clearInterval(S.mm);
  S.room=null;S.players={};S.hits=[];S.phase='home';
  document.body.classList.remove('play');
  home();
}
function applyHit(h){
  if(!h||!Number.isInteger(h.k)||h.k<0||h.k>=N||S.hits.some(x=>x.k===h.k)||S.hits.length>=N)return;
  if(!S.players[h.p])S.players[h.p]={n:String(h.n||'لاعب').slice(0,16),s:0};
  h.pts=Math.max(0,Math.min(16,Number(h.pts)||0));
  S.hits.push(h);
  S.players[h.p].s+=h.pts;
  if(h.p===S.me){
    S.combo++;
    P.stats.ans=(P.stats.ans||0)+1;
    if(S.combo>(P.stats.maxCombo||0))P.stats.maxCombo=S.combo;
    save();
    floatPoints(`+${h.pts}`);
  }
  sfx.ok();
  if(S.phase==='q')draw();
}

function plan(){
  let seen=[];try{seen=JSON.parse(localStorage.getItem('vs')||'[]')}catch(e){}
  const ids=QS.map((q,i)=>i).filter(i=>S.sel.has(QS[i][2]));
  let pool=ids.filter(i=>!seen.includes(i));
  if(pool.length<S.tot){seen=seen.filter(i=>!ids.includes(i));pool=ids.slice()}
  for(let j=pool.length-1;j>0;j--){const k=Math.floor(Math.random()*(j+1));[pool[j],pool[k]]=[pool[k],pool[j]]}
  const p=pool.slice(0,Math.min(S.tot,pool.length));
  try{localStorage.setItem('vs',JSON.stringify(seen.concat(p)))}catch(e){}
  return p;
}

function presence(){
  try{
    const db=fbDb(),me=db.ref('presence/'+Math.random().toString(36).slice(2,10));
    db.ref('.info/connected').on('value',x=>{if(x.val()){me.onDisconnect().remove();me.set(Date.now())}});
    db.ref('presence').on('value',x=>{const e=$('#onl');if(e)e.textContent='🟢 المتصلون الآن: '+x.numChildren()});
  }catch(e){}
}

async function quick(){
  if(!online())return home('لا يوجد اتصال بالإنترنت');
  $('#er').textContent='جارٍ البحث عن لعبة...';
  try{
    const r=fbDb().ref('mm/open');
    const res=await r.transaction(cur=>{
      const now=Date.now();
      if(cur&&cur.n<4&&now-cur.t<45000)return{c:cur.c,n:cur.n+1,t:cur.t};
      return{c:code(),n:1,t:now};
    });
    const v=res.snapshot.val();
    if(!v||!v.c)throw 0;
    enter(v.c,v.n===1,true);
  }catch(e){$('#er').textContent='تعذّر الاتصال، حاول مرة أخرى'}
}

function startMM(){
  S.t0=Date.now();let last=0;
  S.mm=setInterval(()=>{
    const n=Object.keys(S.players).length,el=(Date.now()-S.t0)/1000;
    const w=$('#wt');if(w)w.textContent=n<2?'بانتظار لاعبين آخرين...':(n>=4?'اكتمل العدد!':'ستبدأ اللعبة بعد '+Math.max(0,Math.ceil(25-el))+' ثانية');
    if(el-last>=10){last=el;fbDb().ref('mm/open').transaction(c=>c&&c.c===S.code?{c:c.c,n:c.n,t:Date.now()}:c)}
    if(n>=4||(el>=25&&n>=2)){
      clearInterval(S.mm);
      fbDb().ref('mm/open').transaction(c=>c&&c.c===S.code?null:c);
      S.sel=new Set(CATS);S.tot=6;S.plan=plan();
      S.room.emit('q',{i:S.plan[0],r:1,t:S.plan.length});
    }
  },1000);
}

function lobby(){
  S.phase='lobby';document.body.classList.remove('play');
  const list=Object.values(S.players).map(p=>`<div class="row"><span>${pn(p)}</span></div>`).join('')||'<p class="s">بانتظار اللاعبين...</p>';
  if(S.auto){
    app.innerHTML=`<div class="card" style="text-align:center"><div style="font-size:38px">🎲</div><b>نبحث عن منافسين عشوائيين...</b><p class="s" id="wt" style="margin:8px 0 0">${S.host?'بانتظار لاعبين آخرين...':'بانتظار بدء اللعبة'}</p></div><div class="card"><b>اللاعبون (${Object.keys(S.players).length})</b>${list}</div>`;
    return;
  }
  const cfg=S.host?`<div class="card"><b>المواضيع</b><div class="chips2" id="cats" style="margin-top:8px">${CATS.map(c=>`<span class="chip ${S.sel.has(c)?'on':''}" data-c="${c}">${c}</span>`).join('')}</div>
  <p class="s" style="margin:14px 0 6px;text-align:right">عدد الأسئلة</p><div class="chips2" id="nn">${[5,8,12].map(n=>`<span class="chip ${S.tot===n?'on':''}" data-n="${n}">${n}</span>`).join('')}</div>
  <p class="s" style="margin:10px 0 0;font-size:13px">${QS.filter(q=>S.sel.has(q[2])).length} سؤالاً متاحاً في المواضيع المختارة</p></div>`:'';
  app.innerHTML=`<div class="card"><p class="s" style="margin:0">كود الغرفة (شاركه مع أصدقائك)</p>
  <div class="code">${S.code}</div></div>
  <div class="card"><b>اللاعبون (${Object.keys(S.players).length})</b>${list}</div>${cfg}
  ${S.host?'<button id="go">ابدأ اللعبة 🚀</button>':'<p class="s">بانتظار المضيف ليبدأ...</p>'}
  <button id="lv-rm" class="o" style="text-align:center;margin-top:8px">مغادرة الغرفة</button>`;
  $('#lv-rm').onclick=leaveRoom;
  if(S.host){
    app.querySelectorAll('#cats .chip').forEach(e=>e.onclick=()=>{const c=e.dataset.c;if(S.sel.has(c)){if(S.sel.size>1)S.sel.delete(c)}else S.sel.add(c);lobby()});
    app.querySelectorAll('#nn .chip').forEach(e=>e.onclick=()=>{S.tot=+e.dataset.n;lobby()});
    $('#go').onclick=()=>{S.plan=plan();S.room.emit('q',{i:S.plan[0],r:1,t:S.plan.length})};
  }
}

function slots(show){
  const q=QS[S.i];
  let h='';
  for(let j=0;j<N;j++){
    const x=S.hits.find(t=>t.k===j),pt=N-j;
    const isH=S.hinted&&S.hinted.includes(j);
    const ansText=nm(q,j);
    if(x){
      h+=`<div class="slot f ${x===S.hits[S.hits.length-1]&&!show?'new':''}"><span><b>${j+1}.</b> ${esc(ansText)} <small>— ${S.players[x.p]?pn(S.players[x.p]):esc(x.n)}</small></span><span class="pt">+${x.pts}</span></div>`;
    }else if(show){
      h+=`<div class="slot"><span><b>${j+1}.</b> ${esc(ansText)}</span><span class="pt">${pt}</span></div>`;
    }else if(isH){
      h+=`<div class="slot hinted"><span><b>${j+1}.</b> 💡 ${esc(ansText[0])}...</span><span class="pt">${pt}</span></div>`;
    }else{
      h+=`<div class="slot"><span><b>${j+1}.</b> ؟؟؟</span><span class="pt">${pt}</span></div>`;
    }
  }
  return h;
}

function showQ(){
  S.phase='q';document.body.classList.add('play');
  S.x2=false;
  const q=QS[S.i];
  app.innerHTML=`
  <div class="card" style="margin-bottom:8px;padding:12px">
    <div class="top"><span>سؤال <b>${S.r}</b> من <b>${S.nq}</b> · ${QS[S.i][2]}</span><span id="tl" style="font-weight:800;color:var(--tx)">60</span></div>
    <div class="bar"><i id="pb"></i></div>
    <div class="q" style="font-size:19px;margin:4px 0 10px">${esc(q[0])}</div>
    <div id="sl" class="sg"></div>
    <div class="pw-bar" style="grid-template-columns:1fr 1fr">
      <button type="button" class="pw-btn" id="on-hint"><span>💡 تلميح شخصي</span><small>متاح: ${P.pw.hint}</small></button>
      <button type="button" class="pw-btn" id="on-x2"><span>⚡ مضاعفة القادمة</span><small>متاح: ${P.pw.x2}</small></button>
    </div>
    <div class="chips" id="bd"></div>
    <p class="s" id="msg" style="margin:6px 0 0;min-height:20px;font-size:13px"></p>
  </div>
  <div class="dock">
    <input id="gs" placeholder="اكتب إجابتك قبل الجميع..." maxlength="40" autocomplete="off">
    <button id="sd">إرسال</button>
  </div>`;

  $('#on-hint').onclick=()=>{
    if(P.pw.hint<=0)return toast('لا تملك تلميحات!');
    const hidden=[0,1,2,3,4,5,6,7].filter(k=>!S.hits.some(h=>h.k===k)&&!S.hinted.includes(k));
    if(!hidden.length)return;
    P.pw.hint--;save();
    S.hinted.push(hidden[0]);
    sfx.pw();draw();toast('تم كشف تلميح لك 💡');
  };
  $('#on-x2').onclick=()=>{
    if(S.x2)return;
    if(P.pw.x2<=0)return toast('لا تملك مضاعفة!');
    P.pw.x2--;save();
    S.x2=true;sfx.pw();draw();toast('مضاعفة النقاط جاهزة ⚡');
  };

  const send=()=>{
    const t=$('#gs').value.trim();
    if(!t||S.phase!=='q')return;
    $('#gs').value='';
    S.room.emit('guess',{i:S.i,t,x2:S.x2});
    S.x2=false;
    draw();
    $('#gs').focus();
  };
  $('#sd').onclick=send;
  $('#gs').onkeydown=e=>{if(e.key==='Enter')send()};
  draw();
  clearInterval(S.tm);
  S.tm=setInterval(()=>{
    const left=Math.max(0,S.dl-Date.now());
    const t=$('#tl'),p=$('#pb');
    if(t)t.textContent=Math.ceil(left/1000);
    if(p)p.style.width=(left/T*100)+'%';
    if(left<=0){clearInterval(S.tm);if(S.host&&S.phase==='q')S.room.emit('end',{i:S.i})}
  },250);
}

function draw(){
  const a=$('#sl'),b=$('#bd');
  if(a)a.innerHTML=slots();
  if(b)b.innerHTML=Object.values(S.players).sort((x,y)=>y.s-x.s).map(p=>`<span class="chip">${pn(p)} · <b style="color:var(--pri)">${p.s}</b></span>`).join('');
  const hb=$('#on-hint'),xb=$('#on-x2');
  if(hb)hb.querySelector('small').textContent=`متاح: ${P.pw.hint}`;
  if(xb){xb.querySelector('small').textContent=S.x2?'مُفعّلة ⚡':`متاح: ${P.pw.x2}`;xb.classList.toggle('active',S.x2)}
}

function finish(){
  clearInterval(S.tm);
  S.phase='r';document.body.classList.remove('play');
  const q=QS[S.i];
  const last=S.r>=S.nq;
  const rank=Object.values(S.players).sort((a,b)=>b.s-a.s);
  if(last&&!S.paid&&S.players[S.me]){
    S.paid=true;
    const me=S.players[S.me];
    S.earn=me.s+10+(rank[0]===me&&rank.length>1?25:0);
    P.coins+=S.earn;
    P.stats.g=(P.stats.g||0)+1;
    if(rank[0]===me)P.stats.w=(P.stats.w||0)+1;
    const xpEarned=Math.max(10,Math.floor(me.s/3)+(rank[0]===me?30:10));
    awardXP(xpEarned,'مباراة جماعية');
    addHistory('مباراة جماعية',me.s,rank[0]===me,S.earn);
    checkAchievements();
    save();sfx.win();confetti();vib([40,60,40]);
  }
  const rows=rank.map((p,k)=>`<div class="row"><span>${last&&k===0?'🏆 ':(k+1)+'. '}${pn(p)}</span><b>${p.s}</b></div>`).join('');
  app.innerHTML=`<div class="card"><div class="q">${esc(q[0])}</div><div class="sg">${slots(true)}</div></div>
  <div class="card"><b>${last?'النتيجة النهائية':'الترتيب'}</b>${last&&S.earn?` <span class="pt" style="float:left">+${S.earn} 🪙</span>`:''}${rows}</div>
  ${S.host?`<button id="nx">${last?'لعبة جديدة':'السؤال التالي ←'}</button>`:`<p class="s">${last?'انتهت اللعبة 🎉':'بانتظار المضيف...'}</p>`}`;
  const nx=$('#nx');
  if(S.auto&&last){
    if(nx)nx.remove();
    const b=document.createElement('button');b.textContent='العودة للرئيسية';b.onclick=leaveRoom;app.appendChild(b);
  }else if(S.host&&nx){
    nx.onclick=()=>{if(last)lobby();else S.room.emit('q',{i:S.plan[S.r],r:S.r+1,t:S.nq})};
  }
}

window.addEventListener('offline',()=>{if(S.phase==='home')home()});
window.addEventListener('online',()=>{if(S.phase==='home'){if(typeof firebase==='undefined')location.reload();else home()}});
let tp=0;$('#hr').onclick=()=>{if(++tp>=5){tp=0;unlock()}};
home();
presence();
</script>
</body>
</html>
